name: Nightly Build

# 每日检查是否有新提交，有则构建并发 pre-release，没有则整体跳过。
# 触发时间：GitHub Actions cron 为 UTC；北京时间 17:00 = UTC 09:00。
# 跳过规则：HEAD 与最近一个 nightly 标签指向同一提交时不构建（同一提交不重复发 pre-release，省 runner 与存储）。
# tag 命名：nightly-YYYYMMDD.当日构建次数（当日重跑自动递增）；包版本号不随 nightly 变化（docs/VERSIONING.md）。
# 手动触发默认同样受跳过规则约束，需要重新发布同一提交时勾选 force。

on:
  schedule:
    - cron: '0 9 * * *' # UTC 09:00 = 北京时间 17:00
  workflow_dispatch: # 支持手动触发（Actions 页面 Run workflow）
    inputs:
      force:
        description: '强制构建：当前提交已有 nightly 时也发新 pre-release'
        type: boolean
        default: false

permissions:
  contents: write # 创建 release 与 tag

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.commits.outputs.should_build }}
      new_commits: ${{ steps.commits.outputs.new_commits }}
      since: ${{ steps.commits.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 tags 才能判断上次 nightly 落在哪个提交

      - name: 判断是否有新提交
        id: commits
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "手动触发且 force=true，跳过提交检查，强制构建。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "new_commits=0" >> "$GITHUB_OUTPUT"
            echo "since=(force)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_SHA=$(git rev-parse HEAD)

          # 已有 nightly 指向当前提交 → 无新提交，跳过（不重复发布同一提交）
          EXISTING=''
          for t in $(git tag -l 'nightly-*'); do
            if [ "$(git rev-parse "${t}^{commit}")" = "$HEAD_SHA" ]; then
              EXISTING="$t"
              break
            fi
          done
          if [ -n "$EXISTING" ]; then
            echo "当前提交 ${HEAD_SHA:0:8} 已由 ${EXISTING} 发布过，跳过本次 nightly。"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 统计自最近一次可从 HEAD 追溯到的 nightly 以来的新提交数（写入 release 说明）
          LAST_TAG=$(git tag -l 'nightly-*' --merged HEAD | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            echo "尚无可从 HEAD 追溯的 nightly 标签，按首次发布处理。"
            COUNT=$(git rev-list --count HEAD)
            SINCE='(首次发布)'
          else
            COUNT=$(git rev-list --count "${LAST_TAG}..HEAD")
            SINCE="$LAST_TAG"
          fi
          echo "检测到 ${COUNT} 个新提交（基准：${SINCE}），继续构建。"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "new_commits=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"

  nightly:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tags 来计算当日构建次数

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 质量门禁（typecheck + 全量测试）
        run: |
          npm run typecheck
          npm run typecheck:ui
          npm test

      - name: 构建 TS 支线（dist/）
        run: npm run build

      - name: 打 npm 包（版本号不递增）
        run: npm pack

      - name: 构建 Rust 支线（目录存在时）
        run: |
          if [ -d HyperSoundEngineRust ]; then
            echo '检测到 Rust 支线，构建 release……'
            (cd HyperSoundEngineRust && cargo build --release)
          else
            echo 'HyperSoundEngineRust/ 尚不存在，跳过 Rust 构建'
          fi

      - name: 汇总产物
        run: |
          mkdir -p nightly-artifacts
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d)
          tar -czf "nightly-artifacts/hypersoundengine-ts-dist-${STAMP}.tar.gz" dist
          cp hypersoundengine-*.tgz nightly-artifacts/ 2>/dev/null || true
          if [ -d HyperSoundEngineRust/target/release ]; then
            find HyperSoundEngineRust/target/release -maxdepth 1 -type f -executable \
              \( -name 'hse-*' -o -name '*.exe' -o -name '*.dll' \) \
              -exec cp {} nightly-artifacts/ \; 2>/dev/null || true
          fi
          echo '--- 产物清单 ---'
          ls -la nightly-artifacts/

      - name: 计算版本（项目名 + 今日日期 + 当日构建次数）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y%m%d)
          DATE_PRETTY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          LAST=$(git tag -l "nightly-${TODAY}.*" | sed "s/^nightly-${TODAY}\.//" | sort -n | tail -1)
          NEXT=$(( ${LAST:-0} + 1 ))
          echo "TAG=nightly-${TODAY}.${NEXT}" >> "$GITHUB_ENV"
          echo "DATE_PRETTY=${DATE_PRETTY}" >> "$GITHUB_ENV"
          echo "BUILD_NO=${NEXT}" >> "$GITHUB_ENV"

      - name: 发布 Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COMMITS: ${{ needs.check.outputs.new_commits }}
          SINCE: ${{ needs.check.outputs.since }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          PKG_VER=$(node -p "require('./package.json').version")
          cat > release-notes.md <<EOF
          有新的提交才构建（北京时间 17:00 检查触发；无新提交时工作流整体跳过）。

          - 提交：\`${SHA}\`
          - 自 \`${SINCE}\` 以来的新提交：${NEW_COMMITS} 个
          - 包版本：\`${PKG_VER}\`（nightly 不递增版本号，规则见 docs/VERSIONING.md）
          - 产物：TS 支线 \`dist/\` 与 npm 包；Rust 支线二进制（存在时）
          - 标签：\`${TAG}\`（nightly-日期.当日构建次数）
          EOF
          gh release create "$TAG" nightly-artifacts/* \
            --prerelease \
            --title "HyperSoundEngine ${DATE_PRETTY} #${BUILD_NO}" \
            --notes-file release-notes.md
